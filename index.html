<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#120a22"
    >

    <title>Chat & Earn - CherySpin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #241238 0%,
                    #0e0718 45%,
                    #07030f 100%
                );
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            min-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: #ffd54a;
        }

        .tagline {
            color: #9d96aa;
            font-size: 14px;
            margin-top: 8px;
        }

        .card {
            background: #120a22;
            border: 1px solid rgba(255, 213, 74, 0.14);
            border-radius: 22px;
            padding: 25px 20px;
            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.45);
        }

        .card h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .description {
            color: #9d96aa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #ddd7e5;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #332344;
            border-radius: 12px;
            background: #0d0717;
            color: #ffffff;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ffd54a;
        }

        input::placeholder {
            color: #625b6c;
        }

        .age-hint {
            color: #625b6c;
            font-size: 11px;
            margin-top: 6px;
        }

        .password-hint {
            color: #625b6c;
            font-size: 11px;
            margin-top: 6px;
        }

        .continue-btn {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    #ffd54a,
                    #ff9e00
                );
            color: #170d00;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow:
                0 8px 25px rgba(255, 158, 0, 0.18);
        }

        .continue-btn:active {
            transform: scale(0.98);
        }

        .continue-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ff8585;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #72e69a;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #81798d;
            font-size: 13px;
        }

        .login-link a {
            color: #ffd54a;
            text-decoration: none;
            font-weight: 700;
        }

        .bottom-text {
            text-align: center;
            color: #625b6c;
            font-size: 11px;
            margin-top: 20px;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(23, 13, 0, 0.25);
            border-top-color: #170d00;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 380px) {

            body {
                padding: 15px;
            }

            .app {
                min-height: calc(100vh - 30px);
            }

            .card {
                padding: 22px 16px;
            }

            .logo h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">

        <h1>
            Chat & <span>Earn</span>
        </h1>

        <p class="tagline">
            Connect • Chat • Learn • Earn
        </p>

    </div>


    <div class="card">

        <h2>
            Create Your Profile
        </h2>

        <p class="description">
            Enter your details to get started.
        </p>


        <form id="registerForm">

            <!-- Full Name -->
            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- Age -->
            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="18"
                    max="99"
                    placeholder="18 - 99"
                    required
                >

                <div class="age-hint">
                    You must be 18 or older.
                </div>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Phone Number -->
            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="07XXXXXXXX"
                    autocomplete="tel"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <div class="password-hint">
                    Password must be at least 6 characters.
                </div>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="continue-btn"
                id="continueBtn"
            >
                CONTINUE
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="./login.html">
                Login
            </a>

        </div>

    </div>


    <div class="bottom-text">
        Chat • Connect • Learn • Earn
    </div>

</div>


<script>

    const API_URL =
        "https://cheryspin-backend-1.onrender.com";


    const form =
        document.getElementById("registerForm");

    const continueBtn =
        document.getElementById("continueBtn");

    const message =
        document.getElementById("message");


    function showError(text) {

        message.className =
            "message error";

        message.textContent =
            text;
    }


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const age =
                Number(
                    document
                        .getElementById("age")
                        .value
                );


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            /* =========================
               VALIDATE NAME
            ========================= */

            if (!fullName) {

                showError(
                    "Please enter your full name."
                );

                return;
            }


            /* =========================
               VALIDATE AGE
            ========================= */

            if (
                !Number.isInteger(age) ||
                age < 18 ||
                age > 99
            ) {

                showError(
                    "Age must be between 18 and 99."
                );

                return;
            }


            /* =========================
               VALIDATE EMAIL
            ========================= */

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                showError(
                    "Please enter a valid email address."
                );

                return;
            }


            /* =========================
               VALIDATE PHONE
            ========================= */

            if (!/^07\d{8}$/.test(phone)) {

                showError(
                    "Please enter a valid phone number such as 0712345678."
                );

                return;
            }


            /* =========================
               VALIDATE PASSWORD
            ========================= */

            if (password.length < 6) {

                showError(
                    "Password must be at least 6 characters."
                );

                return;
            }


            /* =========================
               CONFIRM PASSWORD
            ========================= */

            if (password !== confirmPassword) {

                showError(
                    "Passwords do not match."
                );

                return;
            }


            /* =========================
               START REQUEST
            ========================= */

            continueBtn.disabled =
                true;

            continueBtn.innerHTML =
                '<span class="loading"></span>CREATING...';

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                full_name:
                                    fullName,

                                age:
                                    age,

                                email:
                                    email,

                                phone:
                                    phone,

                                password:
                                    password,

                                confirm_password:
                                    confirmPassword

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to create account."
                    );

                }


                /* =========================
                   SAVE USER SESSION
                ========================= */

                localStorage.setItem(
                    "cherySpinLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "cherySpinUserId",
                    String(data.user.id)
                );


                localStorage.setItem(
                    "cherySpinName",
                    data.user.full_name
                );


                localStorage.setItem(
                    "cherySpinAge",
                    String(data.user.age)
                );


                localStorage.setItem(
                    "cherySpinEmail",
                    data.user.email
                );


                localStorage.setItem(
                    "cherySpinPhone",
                    data.user.phone
                );


                localStorage.setItem(
                    "cherySpinBalance",
                    String(data.user.balance)
                );


                localStorage.setItem(
                    "cherySpinFreeSpins",
                    String(data.user.free_spins)
                );


                localStorage.setItem(
                    "cherySpinActivated",
                    String(data.user.is_activated)
                );


                /* =========================
                   GO TO DASHBOARD
                ========================= */

                window.location.href =
                    "./dashboard.html";


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showError(
                    error.message ||
                    "Unable to connect to the CherySpin server."
                );


                continueBtn.disabled =
                    false;

                continueBtn.textContent =
                    "CONTINUE";

            }

        }
    );

</script>

</body>
</html>
