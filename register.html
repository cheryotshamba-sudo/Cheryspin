<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#120a22">

    <title>Register - CherySpin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #241238 0%,
                    #0e0718 45%,
                    #07030f 100%
                );
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .logo span {
            color: #ffd54a;
        }

        .subtitle {
            text-align: center;
            color: #9d96aa;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .card {
            background: #120a22;
            border: 1px solid rgba(255, 213, 74, 0.12);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .description {
            color: #81798d;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #d7d1df;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(255, 213, 74, 0.12);
            border-radius: 12px;
            outline: none;
            padding: 0 14px;
            background: #0d0718;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus {
            border-color: #ffd54a;
        }

        input::placeholder {
            color: #625b6c;
        }

        .register-btn {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 13px;
            margin-top: 5px;
            background:
                linear-gradient(
                    135deg,
                    #ffd54a,
                    #ff9e00
                );
            color: #170d00;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }

        .register-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            min-height: 20px;
            margin-top: 13px;
            text-align: center;
            font-size: 12px;
            line-height: 1.4;
        }

        .login-text {
            text-align: center;
            color: #81798d;
            font-size: 12px;
            margin-top: 20px;
        }

        .login-text a {
            color: #ffd54a;
            text-decoration: none;
            font-weight: 800;
        }

        .footer {
            text-align: center;
            color: #625b6c;
            font-size: 10px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="logo">
        Chery<span>Spin</span>
    </div>

    <div class="subtitle">
        Create your CherySpin account
    </div>


    <div class="card">

        <div class="title">
            Create Account
        </div>

        <div class="description">
            Register your account to continue to CherySpin.
        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                CREATE ACCOUNT
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="./login.html">
                Login
            </a>

        </div>

    </div>


    <div class="footer">
        CherySpin
    </div>

</div>


<script>

    const API_URL =
        "https://cheryspin-backend-1.onrender.com";


    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;


        if (!fullName || !phone || !password) {

            message.textContent =
                "Please complete all fields.";

            message.style.color =
                "#ff9e9e";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            message.style.color =
                "#ff9e9e";

            return;
        }


        button.disabled = true;

        button.textContent =
            "CREATING ACCOUNT...";

        message.textContent =
            "Please wait...";

        message.style.color =
            "#ffd54a";


        try {

            const response =
                await fetch(
                    API_URL + "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            full_name: fullName,
                            phone: phone,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Registration failed."
                );

            }


            localStorage.setItem(
                "cherySpinLoggedIn",
                "true"
            );

            localStorage.setItem(
                "cherySpinUserId",
                data.user.id
            );

            localStorage.setItem(
                "cherySpinName",
                data.user.full_name
            );

            localStorage.setItem(
                "cherySpinPhone",
                data.user.phone
            );


            message.textContent =
                "Account created successfully.";

            message.style.color =
                "#ffd54a";


            setTimeout(function() {

                window.location.href =
                    "./dashboard.html";

            }, 700);


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            message.textContent =
                error.message ||
                "Unable to connect to the server.";

            message.style.color =
                "#ff9e9e";


            button.disabled = false;

            button.textContent =
                "CREATE ACCOUNT";

        }

    });

</script>

</body>

</html>
