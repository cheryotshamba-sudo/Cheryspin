<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#120a22">

    <title>CherySpin - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #241238 0%,
                    #0e0718 45%,
                    #07030f 100%
                );
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 21px;
            font-weight: 900;
        }

        .brand span {
            color: #ffd54a;
        }

        .back {
            color: #9d96aa;
            text-decoration: none;
            font-size: 14px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px 0;
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9d96aa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #d8d2df;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 213, 74, 0.13);
            outline: none;
            background: #120a22;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            border-color: #ffd54a;
        }

        input::placeholder {
            color: #655e70;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #ffd54a;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot {
            display: block;
            text-align: right;
            color: #ffd54a;
            text-decoration: none;
            font-size: 12px;
            margin-top: -5px;
            margin-bottom: 22px;
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    #ffd54a,
                    #ff9e00
                );
            color: #170d00;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow:
                0 8px 25px rgba(255, 158, 0, 0.18);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ff8585;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #72e69a;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #81798d;
            font-size: 13px;
        }

        .register-text a {
            color: #ffd54a;
            text-decoration: none;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            color: #5f586b;
            font-size: 11px;
            padding-top: 10px;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(23, 13, 0, 0.25);
            border-top-color: #170d00;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <div class="brand">
            Chery<span>Spin</span>
        </div>

        <a
            href="./index.html"
            class="back"
        >
            Register
        </a>

    </div>


    <div class="content">

        <h1 class="title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your CherySpin account and continue.
        </p>


        <form id="loginForm">

            <!-- Email or Phone -->
            <div class="form-group">

                <label for="identifier">
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    placeholder="Enter email or phone number"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <a
                href="#"
                class="forgot"
                onclick="return false;"
            >
                Forgot password?
            </a>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="./index.html">
                Create Account
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 CherySpin
    </div>

</div>


<script>

    const API_URL =
        "https://cheryspin-backend-1.onrender.com";


    function togglePassword() {

        const input =
            document.getElementById(
                "password"
            );

        const button =
            document.querySelector(
                ".show-password"
            );


        if (input.type === "password") {

            input.type = "text";

            button.textContent =
                "HIDE";

        } else {

            input.type = "password";

            button.textContent =
                "SHOW";
        }
    }


    const form =
        document.getElementById(
            "loginForm"
        );

    const message =
        document.getElementById(
            "message"
        );

    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;
    }


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const identifier =
                document
                    .getElementById(
                        "identifier"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            if (
                !identifier ||
                !password
            ) {

                showMessage(
                    "Please enter your email or phone number and password.",
                    "error"
                );

                return;
            }


            loginBtn.disabled =
                true;

            loginBtn.innerHTML =
                '<span class="loading"></span>LOGGING IN...';


            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                identifier:
                                    identifier,

                                password:
                                    password

                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Invalid email/phone number or password."
                    );
                }


                /*
                 * Save the complete
                 * authenticated user session.
                 */

                localStorage.setItem(
                    "cherySpinLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "cherySpinUserId",
                    String(
                        data.user.id
                    )
                );

                localStorage.setItem(
                    "cherySpinName",
                    data.user.full_name
                );

                localStorage.setItem(
                    "cherySpinAge",
                    String(
                        data.user.age
                    )
                );

                localStorage.setItem(
                    "cherySpinEmail",
                    data.user.email
                );

                localStorage.setItem(
                    "cherySpinPhone",
                    data.user.phone
                );

                localStorage.setItem(
                    "cherySpinBalance",
                    String(
                        data.user.balance
                    )
                );

                localStorage.setItem(
                    "cherySpinFreeSpins",
                    String(
                        data.user.free_spins
                    )
                );

                localStorage.setItem(
                    "cherySpinActivated",
                    String(
                        data.user.is_activated
                    )
                );


                showMessage(
                    "Login successful. Opening CherySpin...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "./dashboard.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to connect to the CherySpin server.",
                    "error"
                );


                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "LOGIN";
            }

        }
    );

</script>

</body>
</html>
