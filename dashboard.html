<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<title>CherySpin Dashboard</title>

<style>
:root {
    --bg: #111216;
    --panel: #1b1e26;
    --green: #00c58a;
    --red: #ff3548;
    --muted: #929bad;
    --border: #292d38;
    --white: #f8f9fc;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.app {
    width: 100%;
    max-width: 680px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding-bottom: 100px;
}

.header {
    min-height: 76px;
    padding: 10px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    background: #181a21;
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 1;
    font-size: clamp(19px, 5vw, 29px);
    font-weight: 900;
    letter-spacing: -.8px;
    white-space: nowrap;
}

.logo {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: var(--green);
    color: #071b15;
    font-size: 19px;
}

.green {
    color: var(--green);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.header-btn {
    min-width: 38px;
    height: 40px;
    padding: 0 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    background: #1c202a;
    color: var(--green);
    border: 1px solid #303646;
    border-radius: 10px;
    cursor: pointer;
}

.header-btn svg {
    width: 19px;
    height: 19px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

.spins-pill {
    color: var(--red);
    border-color: #58303b;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

.logout-btn {
    color: #b4bdcf;
}

main {
    padding: 17px 16px 0;
}

.balance-card {
    min-height: 91px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    margin-bottom: 13px;
}

.balance-icon {
    width: 44px;
    height: 46px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 1px solid #155b4b;
    border-radius: 11px;
    color: var(--green);
    background: #102a26;
    font-size: 23px;
}

.balance-content {
    min-width: 0;
    flex: 1;
}

.balance-label {
    color: var(--muted);
    font-size: clamp(10px, 3.1vw, 15px);
    font-weight: 700;
    margin-bottom: 7px;
    white-space: nowrap;
}

.balance {
    font-size: clamp(19px, 5.4vw, 29px);
    line-height: 1.1;
    font-weight: 900;
    white-space: nowrap;
}

.deposit-btn {
    min-height: 47px;
    padding: 0 11px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: #031b14;
    font-weight: 900;
    font-size: clamp(11px, 3.1vw, 15px);
    cursor: pointer;
    white-space: nowrap;
}

.spin-info {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 79px;
    padding: 10px;
    margin-bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 5px solid var(--red);
    border-radius: 12px;
}

.sparkle {
    color: var(--red);
    font-size: 24px;
    flex-shrink: 0;
}

.spin-info-text {
    flex: 1;
    min-width: 0;
    font-size: clamp(10px, 3.1vw, 14px);
    line-height: 1.45;
}

.spin-info-text strong {
    font-weight: 800;
}

.red {
    color: var(--red);
}

.spin-count {
    flex-shrink: 0;
    color: #ff6673;
    background: #302027;
    border: 1px solid #66313d;
    border-radius: 8px;
    padding: 6px 7px;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
}

.wheel-section {
    text-align: center;
}

.wheel-wrapper {
    position: relative;
    width: min(82vw, 390px);
    aspect-ratio: 1;
    margin: 23px auto 22px;
    padding: 7px;
    border: 7px solid #242936;
    border-radius: 50%;
    background: #171a22;
    box-shadow:
        0 0 0 3px #303542,
        0 0 0 7px #191c25,
        0 8px 22px #0008;
}

.pointer {
    position: absolute;
    z-index: 8;
    top: -17px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #ff3548;
    filter: drop-shadow(0 3px 3px #0008);
}

.wheel {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #00c58a;
    overflow: hidden;
    background: conic-gradient(
        from -30deg,
        #397ff0 0deg 60deg,
        #f23d43 60deg 120deg,
        #10bd8b 120deg 180deg,
        #07976f 180deg 240deg,
        #ffa900 240deg 300deg,
        #252936 300deg 360deg
    );
    box-shadow: inset 0 0 0 3px #11151d;
    transition: transform 4s cubic-bezier(.12,.75,.16,1);
}

.wheel::after {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
        from -30deg,
        transparent 0deg 59deg,
        #111820 59deg 60deg
    );
    pointer-events: none;
}

.prize {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    width: 39%;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    color: #fff;
    font-size: clamp(10px, 2.8vw, 14px);
    font-weight: 900;
    letter-spacing: -.35px;
    text-shadow: 0 1px 3px #0009;
    white-space: nowrap;
    pointer-events: none;
}

/* Each label is placed halfway between the centre and the rim. */
.prize:nth-child(1) {
    transform: translate(-50%, -50%) rotate(-90deg) translateX(92px);
}

.prize:nth-child(2) {
    transform: translate(-50%, -50%) rotate(-30deg) translateX(92px);
}

.prize:nth-child(3) {
    transform: translate(-50%, -50%) rotate(30deg) translateX(92px);
}

.prize:nth-child(4) {
    transform: translate(-50%, -50%) rotate(90deg) translateX(92px);
}

.prize:nth-child(5) {
    transform: translate(-50%, -50%) rotate(150deg) translateX(92px);
    color: #111820;
    text-shadow: none;
}

.prize:nth-child(6) {
    transform: translate(-50%, -50%) rotate(210deg) translateX(92px);
    color: #e2e7f1;
}

.wheel-center {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    width: 29%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid #0e8e69;
    background: #00c58a;
    color: #031b14;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: clamp(11px, 3vw, 15px);
    font-weight: 900;
    box-shadow: 0 0 0 4px #10171b;
    cursor: pointer;
}

.play-icon {
    font-size: 20px;
    line-height: 1.15;
}

.center-left {
    color: #f52f42;
    font-size: 10px;
    margin-top: 2px;
}

.spin-btn {
    width: 94%;
    min-height: 59px;
    border: 0;
    border-radius: 13px;
    background: var(--green);
    color: #041c15;
    font-size: clamp(15px, 4vw, 20px);
    font-weight: 900;
    box-shadow: 0 8px 22px #00c58a30;
    cursor: pointer;
}

.message {
    min-height: 35px;
    padding: 10px 3px 5px;
    font-size: 12px;
    color: var(--green);
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.bottom-nav {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 680px;
    height: calc(76px + env(safe-area-inset-bottom));
    padding: 5px 3px env(safe-area-inset-bottom);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: #171920;
    border-top: 1px solid #30333d;
}

.nav-item {
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    text-align: center;
    font-size: clamp(10px, 3vw, 13px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
}

.nav-icon {
    font-size: 25px;
    line-height: 1.1;
}

.nav-item.active {
    color: var(--green);
    font-weight: 800;
}

.lock-symbol {
    color: #f0c54a;
    font-size: 9px;
}

@media (min-width: 421px) {
    .header {
        min-height: 88px;
        padding: 12px 20px;
    }

    main {
        padding: 25px 25px 0;
    }

    .wheel-wrapper {
        width: min(75vw, 430px);
        padding: 10px;
        border-width: 9px;
    }

    .prize {
        font-size: 15px;
    }

    .prize:nth-child(1) {
        transform: translate(-50%, -50%) rotate(-90deg) translateX(105px);
    }

    .prize:nth-child(2) {
        transform: translate(-50%, -50%) rotate(-30deg) translateX(105px);
    }

    .prize:nth-child(3) {
        transform: translate(-50%, -50%) rotate(30deg) translateX(105px);
    }

    .prize:nth-child(4) {
        transform: translate(-50%, -50%) rotate(90deg) translateX(105px);
    }

    .prize:nth-child(5) {
        transform: translate(-50%, -50%) rotate(150deg) translateX(105px);
    }

    .prize:nth-child(6) {
        transform: translate(-50%, -50%) rotate(210deg) translateX(105px);
    }
}

@media (max-width: 350px) {
    .brand {
        font-size: 17px;
        gap: 5px;
    }

    .logo {
        width: 35px;
        height: 38px;
        font-size: 16px;
    }

    .header-btn {
        min-width: 32px;
        padding: 0 5px;
    }

    .spins-pill {
        font-size: 10px;
    }

    .balance-card {
        gap: 6px;
        padding: 8px;
    }

    .balance-icon {
        width: 36px;
        height: 40px;
        font-size: 19px;
    }

    .balance {
        font-size: 18px;
    }

    .deposit-btn {
        padding: 0 7px;
        font-size: 10px;
    }

    .prize {
        font-size: 9px;
    }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
    <div class="brand">
        <div class="logo">CS</div>
        <div>Chery<span class="green">Spin</span></div>
    </div>

    <div class="header-actions">
        <button class="header-btn spins-pill" type="button"
                onclick="document.getElementById('wheelSection').scrollIntoView({behavior:'smooth',block:'center'})">
            <span>⟳</span>
            <span id="headerSpins">5 Spins</span>
        </button>

        <button class="header-btn" type="button" id="soundButton"
                aria-label="Toggle sound" onclick="toggleSound()">
            <svg viewBox="0 0 24 24">
                <path d="M11 5 6 9H3v6h3l5 4z"/>
                <path d="M15 9a5 5 0 0 1 0 6"/>
                <path d="M18 6a9 9 0 0 1 0 12"/>
            </svg>
        </button>

        <button class="header-btn logout-btn" type="button"
                aria-label="Logout" onclick="logout()">
            <svg viewBox="0 0 24 24">
                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
                <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
            </svg>
        </button>
    </div>
</header>

<main>
    <section class="balance-card">
        <div class="balance-icon">◉</div>

        <div class="balance-content">
            <div class="balance-label">Total Account Balance</div>
            <div class="balance">KES 1,500</div>
        </div>

        <button class="deposit-btn" type="button" onclick="goDeposit()">
            ↙ Deposit
        </button>
    </section>

    <section class="spin-info">
        <div class="sparkle">✧</div>

        <div class="spin-info-text">
            <strong>
                Free Initial Spins:
                <span class="red" id="inlineSpins">5</span> of 5 spins
            </strong>
            <div>remaining</div>
        </div>

        <div class="spin-count" id="spinCount">5 Left</div>
    </section>

    <section class="wheel-section" id="wheelSection">
        <div class="wheel-wrapper">
            <div class="pointer"></div>

            <div class="wheel" id="wheel">
                <div class="prize">KES 1,000</div>
                <div class="prize">KES 5,000</div>
                <div class="prize">KES 50</div>
                <div class="prize">KES 200</div>
                <div class="prize">KES 500</div>
                <div class="prize">Try Again</div>

                <button class="wheel-center" id="centerButton"
                        type="button" onclick="spinWheel()"
                        aria-label="Spin wheel">
                    <span class="play-icon">▶</span>
                    <span>SPIN</span>
                    <span class="center-left" id="centerSpins">5 LEFT</span>
                </button>
            </div>
        </div>

        <button class="spin-btn" id="spinButton"
                type="button" onclick="spinWheel()">
            ✧ &nbsp; SPIN FREE
            (<span id="buttonSpins">5 LEFT</span>)
        </button>

        <div class="message" id="message" role="status" aria-live="polite"></div>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active" type="button" onclick="goHome()">
        <span class="nav-icon">⟳</span>
        <span>Spin Game</span>
    </button>

    <button class="nav-item" type="button" onclick="goDeposit()">
        <span class="nav-icon">↙</span>
        <span>Deposit</span>
    </button>

    <button class="nav-item" type="button" onclick="showWithdraw()">
        <span class="nav-icon">↗<sup class="lock-symbol">🔒</sup></span>
        <span>Withdraw</span>
    </button>

    <button class="nav-item" type="button" onclick="showProfile()">
        <span class="nav-icon">▣</span>
        <span>Account</span>
    </button>
</nav>

</div>

<script>
"use strict";

const INITIAL_SPINS = 5;
const SPINS_KEY = "cherySpinFreeSpins";

const wheel = document.getElementById("wheel");
const message = document.getElementById("message");
const spinButton = document.getElementById("spinButton");
const centerButton = document.getElementById("centerButton");
const soundButton = document.getElementById("soundButton");

let spins = loadSpins();
let rotation = 0;
let spinning = false;
let soundEnabled = true;

const prizes = [
    "KES 1,000",
    "KES 5,000",
    "KES 50",
    "KES 200",
    "KES 500",
    "Try Again"
];

function loadSpins() {
    try {
        const saved = localStorage.getItem(SPINS_KEY);

        if (saved === null) {
            localStorage.setItem(SPINS_KEY, String(INITIAL_SPINS));
            return INITIAL_SPINS;
        }

        const value = Number(saved);

        if (!Number.isInteger(value) || value < 0 || value > INITIAL_SPINS) {
            return INITIAL_SPINS;
        }

        return value;
    } catch (error) {
        return INITIAL_SPINS;
    }
}

function saveSpins() {
    try {
        localStorage.setItem(SPINS_KEY, String(spins));
    } catch (error) {
        console.warn("Could not save spins on this device.");
    }
}

function updateSpins() {
    document.getElementById("spinCount").textContent = spins + " Left";
    document.getElementById("headerSpins").textContent = spins + " Spins";
    document.getElementById("inlineSpins").textContent = spins;
    document.getElementById("centerSpins").textContent = spins + " LEFT";
    document.getElementById("buttonSpins").textContent = spins + " LEFT";

    spinButton.disabled = spins <= 0 || spinning;
    centerButton.disabled = spins <= 0 || spinning;
}

function spinWheel() {
    if (spinning) return;

    if (spins <= 0) {
        message.textContent = "You have used all 5 free spins.";
        return;
    }

    spinning = true;
    spins--;

    saveSpins();
    updateSpins();

    message.textContent = "Spinning...";

    const winningIndex = Math.floor(Math.random() * prizes.length);
    const sectorSize = 360 / prizes.length;

    /*
      The top pointer is at 270 degrees in CSS conic-gradient coordinates.
      Align the chosen sector's centre with that pointer.
    */
    const targetAngle =
        (270 - (winningIndex * sectorSize + sectorSize / 2) + 360) % 360;

    const currentAngle = ((rotation % 360) + 360) % 360;
    const adjustment = (targetAngle - currentAngle + 360) % 360;

    rotation += 1800 + adjustment;
    wheel.style.transform = "rotate(" + rotation + "deg)";

    window.setTimeout(function() {
        spinning = false;
        updateSpins();

        if (prizes[winningIndex] === "Try Again") {
            message.textContent =
                "Result: Try Again. " + spins + " free spins remaining.";
        } else {
            message.textContent =
                "Wheel result: " + prizes[winningIndex] +
                ". This result has not been connected to backend crediting in this file.";
        }

        if (spins === 0) {
            message.textContent += " You have used all 5 free spins.";
        }
    }, 4200);
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    soundButton.style.color = soundEnabled ? "#00c58a" : "#929bad";
    soundButton.setAttribute(
        "aria-label",
        soundEnabled ? "Turn sound off" : "Turn sound on"
    );
}

function goHome() {
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function goDeposit() {
    window.location.href = "./deposit.html";
}

function showWithdraw() {
    alert("Withdrawals are locked until your account is activated.");
}

function showProfile() {
    const savedName = localStorage.getItem("cherySpinName") || "Player";

    alert(
        "CherySpin Account\n\n" +
        "Name: " + savedName +
        "\nAccount status: Not activated"
    );
}

function logout() {
    if (!confirm("Are you sure you want to log out?")) return;

    localStorage.removeItem("cherySpinLoggedIn");
    window.location.href = "./index.html";
}

updateSpins();
</script>

</body>
</html>
